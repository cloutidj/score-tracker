<div class="player-info">
	<div class="identity-row">
		@if (allowImport()) {
			<button stIconButton
			        [status]="field().color().value() ? 'contrast' : 'muted'"
			        type="button"
			        class="mode-toggle st-on-fill"
			        [attr.aria-label]="mode() === 'manual' ? 'Import from a saved player' : 'Switch to typing a name'"
			        (click)="toggleMode()">
				<ng-icon [name]="mode() === 'manual' ? 'phosphorUserPlus' : 'phosphorKeyboard'"></ng-icon>
			</button>
		}

		@if (allowImport() && mode() === 'import') {
			<st-form-field label="Saved player" class="identity-field">
				<st-select [options]="savedPlayerOptions()"
				           [placeholder]="savedPlayerOptions().length ? 'Choose a saved player' : 'No saved players'"
				           [disabled]="!savedPlayerOptions().length"
				           (valueChange)="importSavedPlayer($event)"/>
			</st-form-field>
		} @else {
			<!-- No error text shown: an invalid name is surfaced via the field's own
				 error state (red label/border), which keeps every row the same height. -->
			<st-form-field label="Player Name"
			               class="identity-field"
			               [invalid]="field().name().invalid()"
			               [touched]="field().name().touched()">
				<input type="text" [formField]="field().name"/>
			</st-form-field>
		}

		<!-- Same treatment for color: the picker shows its own error ring (invalid + touched,
			 read off its bound field) instead of a message that would push the row taller. -->
		<st-color-picker class="color-field" [formField]="field().color" aria-label="Player color"></st-color-picker>
	</div>
</div>
