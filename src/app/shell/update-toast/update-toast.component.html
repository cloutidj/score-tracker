<div class="update-toast" st-layout="horizontal align:center gap:sm" role="status" animate.enter="st-toast-enter" animate.leave="st-toast-leave">
	<span st-text="body" st-layout="flex:auto">A new version is available!</span>
	<button stButton="tonal" status="muted" type="button" (click)="updateApplication.emit()">Update</button>
	<button stIconButton status="muted" type="button" aria-label="Dismiss" (click)="dismiss.emit()">
		<ng-icon name="phosphorX"/>
	</button>
</div>
