<div class="update-toast" role="status" animate.enter="st-fade-in-down" animate.leave="st-fade-out-up">
	<span class="update-text" st-text="body">A new version is available!</span>
	<button stButton="tonal" status="muted" type="button" (click)="updateApplication.emit()">Update</button>
	<button stIconButton type="button" aria-label="Dismiss" (click)="dismiss.emit()">
		<ng-icon name="phosphorX"/>
	</button>
</div>
