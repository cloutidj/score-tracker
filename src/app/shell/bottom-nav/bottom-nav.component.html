<nav class="bottom-nav" role="navigation" aria-label="Main" [style.--nav-active-index]="activeIndex()">
	<!-- Painted in this order, not DOM-arbitrary: the shadowed collar first, then the
		 bar's opaque surface on top of it (masking whatever part of the collar's shadow
		 falls inside the bar's own box), then an unshadowed second collar — same shape,
		 same position — on top of THAT (masking whatever part of the surface's own
		 shadow bleeds upward into the open area the first collar's cap pokes into: a
		 skin whose shadow has an upward component, like Neuro's highlight or Neon's wide
		 blur, would otherwise draw a straight rectangular edge across the round cap),
		 then the button list last so the icons sit above all three. -->
	<div class="bottom-nav-follow" aria-hidden="true" [class.is-visible]="activeIndex() !== null"></div>
	<div class="bottom-nav-surface" aria-hidden="true"></div>
	<div class="bottom-nav-cap" aria-hidden="true" [class.is-visible]="activeIndex() !== null"></div>
	<ul class="bottom-nav-list">
		@for (button of buttons; track button.id) {
			@let active = panelService.openPanel() === button.id;
			<li class="bottom-nav-item" [class.is-active]="active">
				<button type="button"
				        class="bottom-nav-button"
				        stToggleIcon
				        [icon]="button.icon"
				        [open]="active"
				        #toggle="stToggleIcon"
				        [attr.aria-pressed]="active"
				        [attr.aria-label]="button.label"
				        (click)="panelService.toggle(button.id)">
					<ng-icon [name]="toggle.iconName()"/>
				</button>
			</li>
		}
	</ul>
</nav>
