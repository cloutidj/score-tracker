<nav class="bottom-nav" role="navigation" aria-label="Main">
	<div class="bottom-nav-surface" aria-hidden="true"></div>
	<ul class="bottom-nav-list">
		@for (button of buttons; track button.id) {
			@let active = panelService.openPanel() === button.id;
			<li class="bottom-nav-item" [class.is-active]="active">
				<button type="button"
				        class="bottom-nav-button"
				        stToggleIcon
				        [icon]="button.icon"
				        [open]="active"
				        #toggle="stToggleIcon"
				        [attr.aria-pressed]="active"
				        [attr.aria-label]="button.label"
				        (click)="panelService.toggle(button.id)">
					<ng-icon [name]="toggle.iconName()"/>
				</button>
			</li>
		}
	</ul>
</nav>
