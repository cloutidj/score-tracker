@if (descriptor(); as panel) {
	<section class="panel"
	         role="dialog"
	         [attr.aria-label]="panel.title"
	         cdkTrapFocus
	         [cdkTrapFocusAutoCapture]="true"
	         (keydown.escape)="close()"
	         animate.enter="st-panel-enter"
	         animate.leave="st-panel-leave"
	         [style.--panel-header-height.px]="headerHeight()">
		<header class="panel-header" #header>
			<span class="panel-title" st-text="title">{{ panel.title }}</span>
			<button stIconButton status="muted" type="button" aria-label="Close" (click)="close()">
				<ng-icon name="phosphorX"/>
			</button>
		</header>
		<div class="panel-body" [style.--panel-switch-dir]="switchDir()">
			@for (content of contentTokens(); track content.id) {
				<div class="panel-content" animate.enter="panel-content-enter" animate.leave="panel-content-leave">
					<ng-container [ngComponentOutlet]="content.component"/>
				</div>
			}
		</div>
	</section>
}
