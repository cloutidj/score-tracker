<div class="health-points-setup">
	<div class="starting-life-picker">
		<st-form-field label="Starting life" class="starting-life-field">
			<input type="number"
			       inputmode="numeric"
			       min="1"
			       [value]="startingLife()"
			       (input)="setStartingLife($event)"/>
		</st-form-field>
	</div>

	<st-player-selection (selectPlayers)="start($event)"/>
</div>
