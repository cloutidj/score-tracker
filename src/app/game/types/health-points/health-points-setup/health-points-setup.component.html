<div class="health-points-setup">
  <div class="starting-life-picker">
    <mat-form-field appearance="outline" class="starting-life-field">
      <mat-label>Starting life</mat-label>
      <input matInput
             type="number"
             inputmode="numeric"
             min="1"
             [value]="startingLife()"
             (input)="setStartingLife($event)" />
    </mat-form-field>
  </div>

  <st-player-selection (selectPlayers)="start($event)" />
</div>
