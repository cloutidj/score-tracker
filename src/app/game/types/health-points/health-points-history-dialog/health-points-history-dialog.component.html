<div class="st-surface st-dialog-surface history-dialog" [stColor]="data.player.color">
	<h2 class="st-history-title">{{ data.player.name }} — Life History</h2>

	<div class="st-dialog-content">
		@if (state(); as s) {
			<div class="st-history-total">
				<span>Life</span>
				<strong>{{ s.life() }}</strong>
			</div>

			@if (rows().length === 0) {
				<p class="st-history-empty">No changes yet.</p>
			} @else {
				<ol class="st-history-list">
					@for (row of rows(); track row.index) {
						<li class="history-row" st-layout="horizontal align:center gap:sm" [class.damage]="row.delta < 0" [class.heal]="row.delta >= 0">
							<ng-icon class="entry-icon"
							         [name]="row.delta < 0 ? 'phosphorSword' : 'phosphorHeart'"
							         aria-hidden="true"></ng-icon>
							<span class="entry-value">{{ row.delta > 0 ? '+' : '' }}{{ row.delta }}</span>
							<span class="entry-running" st-layout="flex:1">&rarr; {{ row.runningLife }}</span>
							<st-history-entry-actions editLabel="Edit change"
							                           removeLabel="Delete change"
							                           (edit)="editEntry(row.index, row.delta)"
							                           (remove)="removeEntry(row.index)" />
						</li>
					}
				</ol>
			}
		}
	</div>

	<div class="st-dialog-actions">
		<button stButton="filled" status="player" type="button" (click)="close()">Done</button>
	</div>
</div>
