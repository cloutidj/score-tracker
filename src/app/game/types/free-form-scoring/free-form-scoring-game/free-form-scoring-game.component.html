<div class="st-game-toolbar">
	<button stButton="outlined" type="button" class="new-game-button" (click)="newGame()">
		<ng-icon name="phosphorPlus"></ng-icon>
		New Game
	</button>
</div>

<div class="st-tile-grid">
	@for (playerScores of gameService.scores(); track playerScores.player.playerNumber) {
		<div class="player-tile is-interactive"
		     [class.is-leader]="gameService.scored() && playerScores.total() === gameService.leadingTotal()"
		     [stColor]="playerScores.player.color">
			<button type="button"
			        class="tile-add"
			        [attr.aria-label]="'Add score for ' + playerScores.player.name"
			        (click)="addScore(playerScores.player)">
        <span class="tile-header">
          <span class="player-name st-truncate">{{ playerScores.player.name }}</span>
        </span>
				<span class="player-total">
          <span>{{ playerScores.total() }}</span>
					@if (gameService.scored() && playerScores.total() === gameService.leadingTotal()) {
						<ng-icon name="phosphorTrophyFill" class="leader-icon" aria-label="Leading"></ng-icon>
					}
        </span>
				<span class="tile-footer">
          <span class="score-count">
            {{ playerScores.count() }} {{ playerScores.count() === 1 ? 'score' : 'scores' }}
          </span>
        </span>
			</button>

			<button stIconButton
			        status="contrast"
			        type="button"
			        class="tile-history st-on-fill"
			        [disabled]="playerScores.count() === 0"
			        [attr.aria-label]="'Score history for ' + playerScores.player.name"
			        (click)="openHistory(playerScores.player)">
				<ng-icon name="phosphorClockCounterClockwise"></ng-icon>
			</button>
		</div>
	}
</div>

<st-score-track [entries]="trackEntries()" [leadingTotal]="gameService.leadingTotal()" [scored]="gameService.scored()"/>
