<div class="st-surface st-dialog-surface history-dialog" [stColor]="data.player.color">
	<h2 class="st-history-title">{{ data.player.name }} — Score History</h2>

	<div class="st-dialog-content">
		@if (playerScores(); as ps) {
			<div class="st-history-total">
				<span>Total</span>
				<strong>{{ ps.total() }}</strong>
			</div>

			@if (ps.count() === 0) {
				<p class="st-history-empty">No scores yet — add one below.</p>
			} @else {
				<ol class="st-history-list">
					@for (entry of ps.entries(); track $index) {
						<li class="history-row" st-layout="horizontal align:center gap:sm">
							<span class="entry-index" st-layout="horizontal inline align:center justify:center">#{{ $index + 1 }}</span>
							<span class="entry-value" st-layout="flex:1">{{ entry }}</span>
							<st-history-entry-actions editLabel="Edit score"
							                           removeLabel="Delete score"
							                           (edit)="editEntry($index, entry)"
							                           (remove)="removeEntry($index)" />
						</li>
					}
				</ol>
			}
		}
	</div>

	<div class="st-dialog-actions">
		<button stButton status="player" type="button" class="add-button" (click)="addScore()">
			<ng-icon name="phosphorPlus"></ng-icon>
			Add Score
		</button>
		<button stButton="filled" status="player" type="button" (click)="close()">Done</button>
	</div>
</div>
