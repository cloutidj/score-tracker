<div class="st-surface st-dialog-surface">
	<h2 class="st-dialog-title">{{ data.category.name }}</h2>
	<div class="st-dialog-content">
		@if (data.category.description) {
			<p class="category-description">{{ data.category.description }}</p>
		}
		<p class="category-rule"><strong>How it scores:</strong> {{ ruleText }}</p>
	</div>
	<div class="st-dialog-actions">
		<button stButton type="button" (click)="close()">Close</button>
	</div>
</div>
