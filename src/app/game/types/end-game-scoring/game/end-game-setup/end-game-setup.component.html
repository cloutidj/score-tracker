<div class="end-game-setup" st-layout="vertical gap:md">
	<div class="rule-set-picker">
		<st-form-field label="Scoring rule set" class="rule-set-field">
			<st-select [options]="configOptions()"
			           [value]="selectedConfig()?.id ?? null"
			           (valueChange)="select($event)"/>
		</st-form-field>
	</div>

	<st-player-selection (selectPlayers)="start($event)"/>
</div>
