<div class="st-game-toolbar is-split">
	<span class="st-toolbar-label">Round {{ gameService.currentRound() }}</span>
	<button stButton="outlined" type="button" class="new-game-button" (click)="newGame()">
		<ng-icon name="phosphorPlus"></ng-icon>
		New Game
	</button>
</div>

<div class="game-wrapper" st-layout="horizontal wrap justify:center">
	@if (gameService.currentPlayer(); as player) {
		<st-player-score st-layout="flex:none" [player]="player" (score)="gameService.addScore($event)"/>
	}
</div>

<div class="score-history">
	<st-score-track [entries]="trackEntries()"
	                [leadingTotal]="gameService.leadingTotal()"
	                [scored]="gameService.scored()"/>

	<st-per-round-score-table/>
</div>
