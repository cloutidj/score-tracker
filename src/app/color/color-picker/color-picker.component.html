<!-- The trigger is a palette icon, not a swatch: the chosen color is already shown
     by the whole row repainting itself, so a swatch here would just duplicate it.
     Tapping the palette opens a grid of swatches (no names — the colors speak for
     themselves), and picking one recolors the row. -->
<button stIconButton
        status="contrast"
        type="button"
        class="color-trigger st-on-fill"
        stToggleIcon
        icon="phosphorPalette"
        [open]="menuOpen()"
        #toggle="stToggleIcon"
        cdkOverlayOrigin
        #trigger="cdkOverlayOrigin"
        [class.is-invalid]="showError()"
        [disabled]="disabled()"
        (click)="menuOpen.set(!menuOpen())"
        (keydown.escape)="onTriggerEscape($event)"
        [attr.aria-label]="triggerLabel()">
	<ng-icon [name]="toggle.iconName()"></ng-icon>
</button>

<ng-template cdkConnectedOverlay
             [cdkConnectedOverlayOrigin]="trigger"
             [cdkConnectedOverlayOpen]="menuOpen()"
             [cdkConnectedOverlayPositions]="positions"
             [cdkConnectedOverlayHasBackdrop]="true"
             cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
             (backdropClick)="closeMenu()"
             (overlayKeydown)="onOverlayKeydown($event)">
	<div class="st-surface color-menu"
		 role="listbox"
		 animate.enter="st-select-menu-enter"
		 animate.leave="st-select-menu-leave">
		@for (swatch of swatches(); track swatch.hex) {
			<button type="button"
			        class="color-menu-item"
			        st-layout="horizontal justify:center"
			        [attr.aria-label]="swatch.label"
			        (click)="selectColor(swatch.color)">
				<st-color-swatch [color]="swatch.color" [active]="swatch.active"></st-color-swatch>
			</button>
		}
	</div>
</ng-template>
