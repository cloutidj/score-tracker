<button type="button"
        class="st-select-trigger"
        st-layout="horizontal align:center justify:between gap:sm full-width"
        cdkOverlayOrigin
        #trigger="cdkOverlayOrigin"
        aria-haspopup="listbox"
        [attr.aria-expanded]="menuOpen()"
        [disabled]="disabled()"
        (click)="toggleMenu()"
        (keydown.escape)="onTriggerEscape($event)">
  <span class="st-select-value" [class.is-placeholder]="!selectedOption()">
    {{ selectedOption()?.label ?? placeholder() }}
  </span>
	<ng-icon name="phosphorCaretDown"/>
</button>

<ng-template cdkConnectedOverlay
             [cdkConnectedOverlayOrigin]="trigger"
             [cdkConnectedOverlayOpen]="menuOpen()"
             [cdkConnectedOverlayPositions]="positions"
             [cdkConnectedOverlayHasBackdrop]="true"
             cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
             cdkConnectedOverlayPanelClass="st-select-menu"
             (backdropClick)="closeMenu()"
             (overlayKeydown)="onOverlayKeydown($event)">
	<div class="st-surface st-select-menu-list"
	     st-layout="vertical gap:xs"
	     role="listbox"
	     animate.enter="st-select-menu-enter"
	     animate.leave="st-select-menu-leave">
		@for (option of options(); track option.value) {
			<button type="button"
			        class="st-select-menu-item"
			        role="option"
			        [attr.aria-selected]="option.value === value()"
			        [class.is-active]="option.value === value()"
			        (click)="selectOption(option.value)">
				{{ option.label }}
			</button>
		}
	</div>
</ng-template>
