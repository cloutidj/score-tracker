@if (openPanel(); as panel) {
	<section class="panel"
	         role="dialog"
	         [attr.aria-label]="title()"
	         cdkTrapFocus
	         [cdkTrapFocusAutoCapture]="true"
	         (keydown.escape)="close()"
	         animate.enter="st-fade-in-up"
	         animate.leave="st-fade-out-down"
	         [style.--panel-header-height.px]="headerHeight()">
		<header class="panel-header" #header>
			<span class="panel-title" st-text="title">{{ title() }}</span>
			<button stIconButton type="button" aria-label="Close" (click)="close()">
				<ng-icon name="phosphorX"/>
			</button>
		</header>
		<div class="panel-body">
			@switch (panel) {
				@case ('home') {
					<st-home-panel/>
				}
				@case ('styles') {
					<st-styles-panel/>
				}
				@case ('players') {
					<st-saved-players/>
				}
				@case ('ruleSets') {
					<st-scoring-config-manager/>
				}
			}
		</div>
	</section>
}
